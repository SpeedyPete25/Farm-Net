services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: farmnet
      POSTGRES_PASSWORD: farmnet
      POSTGRES_DB: farmnet
    ports:
      - "5432:5432"
    volumes:
      - farmnet_pg_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmnet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  farmnet_pg_data:
