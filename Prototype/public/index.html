<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Lab Booking</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Lab Room & Equipment Booking</h1>
      <div id="user-status"></div>
    </header>

    <main>
      <!-- Authentication area: login and registration tabs -->
      <section id="auth-section" class="card">
        <div class="tabs">
          <button class="tab-button active" data-tab="login">Login</button>
          <button class="tab-button" data-tab="register">Register</button>
        </div>
        <div id="login" class="tab-panel active">
          <h2>Login</h2>
          <form id="login-form">
            <label>Username<input type="text" name="username" required /></label>
            <label>Password<input type="password" name="password" required /></label>
            <button type="submit">Login</button>
          </form>
          <div id="login-error" class="form-error"></div>
        </div>
        <div id="register" class="tab-panel">
          <h2>Register</h2>
          <form id="register-form">
            <label>Username<input type="text" name="username" required /></label>
            <label>Password<input type="password" name="password" required /></label>
            <button type="submit">Register</button>
          </form>
          <div id="register-error" class="form-error"></div>
        </div>
      </section>

      <section id="dashboard-section" class="hidden">
        <div class="toolbar">
          <button id="logout-button">Logout</button>
        </div>

        <div class="grid">
          <article class="card">
            <h2>Available Rooms</h2>
            <div id="rooms-list"></div>
          <!-- Hidden booking panel shown after selecting a room -->
          <div id="booking-panel" class="hidden" style="margin-top: 24px;">
            <h3>Book a room</h3>
            <p id="booking-room-name" style="margin: 0 0 12px 0; font-weight: 700;"></p>
            <form id="booking-form">
              <label>Date<input id="booking-date" type="date" required /></label>
              <label>Start time<input id="booking-start-time" type="time" step="900" required /></label>
              <label>Duration (Hours)<input id="booking-duration" type="number" min="0.25" step="0.25" value="0.25" required />
                <small style="font-weight:400; color:#6b7280;">Use 0.25 for 15 minutes, 0.5 for 30 minutes, 0.75 for 45 minutes.</small>
              </label>
              <div class="form-actions" style="display: flex; gap: 12px; margin-top: 16px;">
                <button type="submit">Confirm booking</button>
                <button type="button" id="booking-cancel" class="secondary">Cancel</button>
              </div>
              <div id="booking-error" class="form-error"></div>
            </form>
          </div>          </article>

          <article class="card">
            <h2>Available Equipment</h2>
            <div id="equipment-list"></div>
          </article>
        </div>

        <article class="card">
          <h2>My Bookings & Loans</h2>
          <div class="filter-controls" style="margin-bottom: 16px;">
            <label>Filter: 
              <select id="booking-filter">
                <option value="active">Active bookings only</option>
                <option value="all">All bookings</option>
              </select>
            </label>
          </div>
          <div id="requests-list"></div>
        </article>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
